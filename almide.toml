[package]
name = "mc_bot_cli"
version = "0.2.0"

[dependencies]
mc_protocol = { git = "https://github.com/almd-mc/mc-protocol" }
mc_bot = { git = "https://github.com/almd-mc/mc-bot" }

# Dialect epoch 15 (#4093): a git dependency outside github.com/almide is fetched only
# from an owner the root manifest trusts.
[trust]
owners = ["github.com/almd-mc"]

[permissions]
native = ["aes", "sha1"]
